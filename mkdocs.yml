site_name: BinDist Documentation
site_description: Documentation for the BinDist Application Distribution System
site_url: https://docs.bindist.eu
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Authentication: getting-started/authentication.md
  - API Reference:
      - Overview: api/overview.md
      - Applications: api/applications.md
      - Versions: api/versions.md
      - Downloads: api/downloads.md
      - Management: api/management.md
  - SDKs:
      - JavaScript SDK: sdks/javascript.md
      - Delphi SDK: sdks/delphi.md
      - PowerShell: sdks/powershell.md
  - Guides:
      - Uploading Applications: guides/uploading.md
      - Managing Customers: guides/customers.md
      - Backups: guides/backups.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bindist
  generator: false

copyright: Copyright &copy; 2024-2025 BinDist
